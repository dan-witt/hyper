[project]
name = "hyper"
version = "0.1.0"
description = "Status board for claude-control sessions"
readme = "README.md"
authors = [
    { name = "Daniel Witt", email = "12972868+dan-witt@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "python-xlib>=0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
hyper = "hyper:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
